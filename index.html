<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
<meta name="description" content="213 道聊天話題，依關係深度分七層，點一下隨機抽一題。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="話題">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>隨機話題產生器</title>
<style>
  :root { color-scheme: light dark; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<style>
  :root {
    --bg: #EFF2F1;
    --surface: #FFFFFF;
    --surface-2: #E4E9E7;
    --ink: #171B1A;
    --ink-2: #5C6663;
    --ink-3: #8A9490;
    --line: #D6DCDA;
    --line-2: #C3CBC8;
    --gold: #9A7420;
    --gold-bg: #F4EBD4;
    --shadow: 0 1px 2px rgba(20,30,28,.05), 0 8px 24px -12px rgba(20,30,28,.16);
    --lv1: #0F7B62; --lv2: #1C6E93; --lv3: #3D5FA8;
    --lv4: #6A54A3; --lv5: #98468E; --lv6: #B03F6B; --lv7: #A82F45;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, system-ui, sans-serif;
    --serif: "Songti TC", "Noto Serif TC", "Source Han Serif TC", "PingFang TC", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121615; --surface: #1C2120; --surface-2: #262C2A;
      --ink: #E9EEEC; --ink-2: #9BA5A1; --ink-3: #6E7874;
      --line: #2C3331; --line-2: #3A4240;
      --gold: #D9B457; --gold-bg: #332C15;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
      --lv1: #3FBFA2; --lv2: #5FB4D8; --lv3: #8298E8;
      --lv4: #B092E4; --lv5: #DC8AD2; --lv6: #EE88A8; --lv7: #F0798C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121615; --surface: #1C2120; --surface-2: #262C2A;
    --ink: #E9EEEC; --ink-2: #9BA5A1; --ink-3: #6E7874;
    --line: #2C3331; --line-2: #3A4240;
    --gold: #D9B457; --gold-bg: #332C15;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    --lv1: #3FBFA2; --lv2: #5FB4D8; --lv3: #8298E8;
    --lv4: #B092E4; --lv5: #DC8AD2; --lv6: #EE88A8; --lv7: #F0798C;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    height: 100%; display: flex; flex-direction: column;
    max-width: 560px; margin: 0 auto; padding: 0 16px;
  }

  /* ---------- header ---------- */
  header { padding-block: 14px 8px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .brand .ver {
    appearance: none; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    background: transparent; border: 1px solid var(--line-2); border-radius: 3px;
    padding: 4px 7px; line-height: 1; transition: color .15s, border-color .15s;
  }
  .brand .ver:active { background: var(--surface-2); }
  .brand .ver:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .brand .count {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; margin-left: auto;
  }

  .levels { display: flex; flex-wrap: wrap; gap: 5px; transition: opacity .2s; }
  .levels.off { opacity: .3; pointer-events: none; }
  .chip {
    appearance: none; border: 1px solid var(--line-2);
    background: transparent; color: var(--ink-2);
    font-family: var(--sans); font-size: 11.5px; line-height: 1;
    padding: 7px 9px 7px 7px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: .35; transition: opacity .15s; }
  .chip .lv { font-family: var(--mono); font-size: 10.5px; }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .chip[aria-pressed="true"] .dot { opacity: 1; }
  .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .utils { display: flex; gap: 8px; margin-top: 9px; }
  .util {
    appearance: none; cursor: pointer; flex: 1 1 0; min-height: 40px;
    background: var(--surface-2); border: 1px solid transparent; border-radius: 5px;
    color: var(--ink-2); font-family: var(--sans); font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .util:active { background: var(--line); }
  .util:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .util svg { flex: 0 0 auto; opacity: .7; }
  .util[aria-pressed="true"] {
    background: color-mix(in srgb, var(--lv1) 14%, transparent);
    border-color: var(--lv1); color: var(--lv1);
  }
  .util[aria-pressed="true"] svg { opacity: 1; }

  .status {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    font-size: 11px; color: var(--ink-3); line-height: 1.5;
  }
  .status button {
    appearance: none; background: transparent; border: 0; padding: 0;
    font-family: var(--sans); font-size: 11px; color: var(--ink-2); cursor: pointer;
    border-bottom: 1px solid var(--line-2);
  }

  /* ---------- card ---------- */
  main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding-block: 10px; }
  .card {
    flex: 1 1 auto; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); padding: 18px 18px 12px;
    cursor: pointer; position: relative; overflow: hidden; min-height: 250px;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--c, var(--line-2)); transition: background .25s;
  }
  .card:active { transform: translateY(1px); }

  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--c); font-weight: 500; }
  .badge b { font-family: var(--sans); font-weight: 600; letter-spacing: 0; margin-left: 4px; }
  .tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; }
  .note { margin: 6px 0 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

  .q {
    flex: 1 1 auto; display: flex; align-items: center;
    font-family: var(--serif); font-size: clamp(20px, 5.4vw, 29px);
    line-height: 1.58; padding-block: 18px; text-wrap: pretty; overflow-y: auto;
  }
  .follow {
    font-size: 13.5px; color: var(--ink); line-height: 1.6; margin: 0;
    background: color-mix(in srgb, var(--c) 8%, transparent);
    border-left: 2px solid var(--c);
    border-radius: 0 4px 4px 0; padding: 9px 12px;
  }
  .follow span {
    display: block; font-family: var(--mono); font-size: 9.5px; font-weight: 500;
    letter-spacing: .14em; color: var(--c); margin-bottom: 4px;
  }

  .cardfoot {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    border-top: 1px solid var(--line); padding-top: 8px;
  }
  .act {
    appearance: none; cursor: pointer; background: transparent;
    border: 1px solid var(--line); border-radius: 4px; color: var(--ink-3);
    font-family: var(--sans); font-size: 11.5px; min-height: 32px; padding: 0 10px;
    display: inline-flex; align-items: center; gap: 4px; transition: all .15s;
  }
  .act:active { background: var(--surface-2); }
  .act:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #fav[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); background: var(--gold-bg); }
  .swipe { flex: 1 1 auto; text-align: center; font-size: 10.5px; color: var(--ink-3); }

  .anim { animation: rise .26s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .anim { animation: none; } .card:active { transform: none; } }

  /* ---------- footer ---------- */
  footer {
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; gap: 8px; }
  .draw {
    flex: 1 1 auto; appearance: none; border: 0; cursor: pointer;
    background: var(--ink); color: var(--bg);
    font-family: var(--sans); font-size: 15px; font-weight: 600; letter-spacing: .08em;
    padding: 15px; border-radius: 5px; transition: opacity .15s;
  }
  .draw:active { opacity: .82; }
  .draw:focus-visible { outline: 2px solid var(--lv3); outline-offset: 2px; }
  .back {
    appearance: none; cursor: pointer; background: transparent;
    border: 1px solid var(--line-2); color: var(--ink-2);
    border-radius: 5px; width: 50px; display: grid; place-items: center;
  }
  .back:disabled { opacity: .35; cursor: default; }
  .tip { font-size: 11.5px; color: var(--ink-3); line-height: 1.6; border-top: 1px solid var(--line); padding-top: 10px; margin: 0; }
  .tip b { color: var(--ink-2); font-weight: 600; }
  .empty { color: var(--ink-3); font-family: var(--sans); font-size: 16px; }

  /* ---------- sheet ---------- */
  .sheetwrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .backdrop { position: absolute; inset: 0; background: rgba(8,12,11,.5); animation: fade .2s; }
  .sheet {
    position: relative; width: 100%; max-width: 560px; max-height: 86vh;
    background: var(--surface); border-radius: 10px 10px 0 0;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 -8px 40px -12px rgba(0,0,0,.4);
    animation: slideup .26s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideup { from { transform: translateY(14px); opacity: .4 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .backdrop, .sheet { animation: none } }

  .sheethead {
    display: flex; align-items: center; gap: 9px;
    padding: 15px 18px 13px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .sheethead h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .03em; }
  .sheethead .now { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .sheethead .x {
    margin-left: auto; appearance: none; cursor: pointer; background: transparent;
    border: 0; color: var(--ink-3); width: 34px; height: 34px; margin-right: -8px;
    display: grid; place-items: center; border-radius: 4px;
  }
  .sheethead .x:active { background: var(--surface-2); }
  .sheetbody {
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  }
  .sh {
    margin: 0 0 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em;
    color: var(--ink-3); text-transform: uppercase; font-family: var(--mono);
  }
  .sh + .sh, .block + .block { margin-top: 0; }
  .block { margin-bottom: 18px; }
  .block:last-child { margin-bottom: 0; }

  details > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px; user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after {
    content: ""; width: 6px; height: 6px; margin-left: 2px;
    border-right: 1.4px solid var(--ink-3); border-bottom: 1.4px solid var(--ink-3);
    transform: rotate(45deg) translate(-2px, -2px); transition: transform .18s;
  }
  details[open] > summary::after { transform: rotate(-135deg) translate(-1px, -1px); }
  details > summary .sh { margin: 0; }
  details > summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }

  .tiles { display: flex; gap: 8px; }
  .tile {
    flex: 1 1 0; background: var(--surface-2); border-radius: 5px; padding: 10px 11px;
  }
  .tile b {
    display: block; font-family: var(--mono); font-size: 21px; font-weight: 500;
    font-variant-numeric: tabular-nums; line-height: 1.2; color: var(--ink);
  }
  .tile span { font-size: 10.5px; color: var(--ink-3); }

  .dist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .dist i {
    font-style: normal; font-family: var(--mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .dist i::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

  .qlist { list-style: none; margin: 0; padding: 0; }
  .qlist li {
    display: flex; gap: 7px; align-items: baseline;
    font-size: 12px; line-height: 1.4; padding: 3.5px 0;
    border-bottom: 1px solid var(--line);
  }
  .qlist li:last-child { border-bottom: 0; }
  .qlist .l {
    flex: 0 0 auto; font-family: var(--mono); font-size: 10px; color: var(--c);
    border: 1px solid currentColor; border-radius: 2px; padding: 1px 3px; opacity: .85;
  }
  .none { font-size: 12px; color: var(--ink-3); margin: 0; line-height: 1.6; }

  .log { list-style: none; margin: 0; padding: 0; }
  .log li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .log li:last-child { border-bottom: 0; }
  .log .v {
    flex: 0 0 34px; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .log .v.cur { color: var(--lv1); font-weight: 500; }
  .log .d { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }

  .danger {
    appearance: none; cursor: pointer; background: transparent;
    border: 1px solid var(--line-2); border-radius: 4px; color: var(--ink-3);
    font-family: var(--sans); font-size: 11.5px; padding: 8px 12px; margin-top: 10px;
  }
  .danger:active { background: var(--surface-2); }
</style>

<div class="app">
  <header>
    <div class="brand">
      <h1>隨機話題產生器</h1>
      <button class="ver" id="ver" type="button" aria-haspopup="dialog"></button>
      <span class="count" id="count"></span>
    </div>
    <div class="levels" id="levels"></div>
    <div class="utils">
      <button class="util" id="ice" type="button" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
          <path d="M6.5 1v11M2 3.8l9 5.4M11 3.8l-9 5.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>破冰模式
      </button>
      <button class="util" id="all" type="button">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
          <path d="M2 6.5 5 9.5l6-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span id="allLabel">全部開啟</span>
      </button>
      <button class="util" id="reset" type="button">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
          <path d="M11 6.5a4.5 4.5 0 1 1-1.35-3.2M11 1.4v3.2H7.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>重新洗牌
      </button>
    </div>
    <div class="status" id="status" hidden>
      <span id="statusText"></span>
      <button type="button" id="restore">復原</button>
    </div>
  </header>

  <main>
    <div class="card" id="card">
      <div class="meta">
        <span class="badge" id="badge"></span>
        <span class="tag" id="tag"></span>
      </div>
      <p class="note" id="note"></p>
      <div class="q" id="q" aria-live="polite"><span class="empty">載入中…<br><span style="font-size:12.5px;line-height:1.7;display:inline-block;margin-top:10px">如果這行字一直沒消失，表示目前開啟這個檔案的程式沒有執行 JavaScript（iOS 的檔案預覽就是這樣）。請改用 Safari 或 Chrome 開啟。</span></span></div>
      <p class="follow" id="follow"></p>
      <div class="cardfoot">
        <button class="act" id="skip" type="button">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
            <path d="M2.5 2.5l6 6M8.5 2.5l-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>不要這題
        </button>
        <span class="swipe">點卡片換下一題</span>
        <button class="act" id="fav" type="button" aria-pressed="false">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
            <path d="M6 .8l1.6 3.3 3.6.5-2.6 2.5.6 3.6L6 9l-3.2 1.7.6-3.6L.8 4.6l3.6-.5z"/>
          </svg>好用
        </button>
      </div>
    </div>
  </main>

  <footer>
    <div class="row">
      <button class="back" id="back" disabled aria-label="回上一題">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="draw" id="draw">抽 一 題</button>
    </div>
    <p class="tip"><b>用法提醒</b>　問之前先講自己的看法：「我覺得○○，你呢？」——這比一問一答有效得多。一次一題，不要連發。</p>
  </footer>
</div>

<div class="sheetwrap" id="sheetwrap" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="使用統計與版本紀錄">
    <div class="sheethead">
      <h2>使用統計</h2>
      <span class="now" id="now"></span>
      <button class="x" id="closeSheet" type="button" aria-label="關閉">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <path d="M3.5 3.5l8 8M11.5 3.5l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="sheetbody" id="sheetbody"></div>
  </div>
</div>

<script>
const VERSION = "1.9";

const CHANGELOG = [
  ["1.9", "改名為隨機話題產生器。單檔版加上 UTF-8 BOM，並在 JavaScript 沒被執行時顯示說明而非空白。"],
  ["1.8", "修正：統計面板與「復原」在獨立 HTML 檔中不會隱藏。另外產出可離線使用的手機版單檔。"],
  ["1.7", "L6 補到 20 題（婚後與長輩同住）、L7 補到 20 題（新增 7 題偏溝通與界線，而非動作）。"],
  ["1.6", "題庫 137 → 205。補上原本完全缺席的輕鬆題（好玩 27、當下 6、假設 9），加入改寫自 Aron 1997 三十六題的 26 題。破冰池從 14 擴到 51。"],
  ["1.5", "統計面板三個區塊可摺疊、清單加密；追問提示改成有色塊的獨立區。"],
  ["1.4", "版本號改成按鈕，點開看使用統計與更新紀錄。"],
  ["1.3", "破冰模式（14 題精選）、「不要這題／好用」標記、137 題全加上追問提示。"],
  ["1.2", "「全部開啟」「重新洗牌」改成實心按鈕；加上版本號。"],
  ["1.1", "加入全開與重置；選單邏輯收斂成單一路徑。"],
  ["1.0", "137 題、依關係深度分七層、不重複抽牌袋、上一題、層級記憶。"],

const DECK = RAW.map(([lv, tag, q, fu, ice], i) => ({ id: i, lv, tag, q, fu, ice: !!ice }));
const FAV_WEIGHT = 3;

const store = {
  get(k, fb) { try { const v = JSON.parse(localStorage.getItem("td." + k)); return v ?? fb; } catch (e) { return fb; } },
  set(k, v) { try { localStorage.setItem("td." + k, JSON.stringify(v)); } catch (e) {} },
};

const el = {};
["levels","ice","all","allLabel","reset","status","statusText","restore",
 "card","badge","tag","note","q","follow","skip","fav","draw","back","count","ver",
 "sheetwrap","backdrop","closeSheet","sheetbody","now"]
  .forEach(id => el[id] = document.getElementById(id));
el.ver.textContent = "v" + VERSION;

const DEFAULT_LEVELS = [1, 2, 3, 4];
let active  = new Set(store.get("levels", DEFAULT_LEVELS));
let skipped = new Set(store.get("skipped", []));
let favs    = new Set(store.get("favs", []));
let iceMode = false;
let bag = [], history = [], current = null;

let stats = store.get("stats", null);
if (!stats || typeof stats !== "object") {
  stats = { draws: 0, byLevel: {}, ice: 0, since: new Date().toISOString().slice(0, 10) };
  store.set("stats", stats);
}
stats.byLevel = stats.byLevel || {};

if (!active.size) active = new Set(DEFAULT_LEVELS);

/* ---------- level chips ---------- */
const chips = LEVELS.map(L => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.style.setProperty("--c", `var(--lv${L.id})`);
  b.innerHTML = `<span class="dot"></span><span class="lv">L${L.id}</span>${L.name}`;
  b.addEventListener("click", () => {
    active.has(L.id) ? active.delete(L.id) : active.add(L.id);
    store.set("levels", [...active]);
    applyLevels();
  });
  el.levels.appendChild(b);
  return b;
});

/* ---------- deck plumbing ---------- */
function pool() {
  const base = iceMode
    ? DECK.filter(d => d.ice)
    : DECK.filter(d => active.has(d.lv));
  return base.filter(d => !skipped.has(d.id));
}

function refill() {
  const p = pool();
  const out = [];
  p.forEach(d => {
    const n = favs.has(d.id) ? FAV_WEIGHT : 1;
    for (let i = 0; i < n; i++) out.push(d);
  });
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  if (current && out.length > 1 && out[out.length - 1].id === current.id) {
    [out[0], out[out.length - 1]] = [out[out.length - 1], out[0]];
  }
  bag = out;
}

function draw() {
  if (!pool().length) { current = null; render(); return; }
  if (!bag.length) refill();
  if (current) { history.push(current); if (history.length > 40) history.shift(); }
  let next = bag.pop();
  while (next && next.id === current?.id && bag.length) next = bag.pop();
  current = next || null;
  if (current) {
    stats.draws++;
    stats.byLevel[current.lv] = (stats.byLevel[current.lv] || 0) + 1;
    if (iceMode) stats.ice++;
    store.set("stats", stats);
  }
  render();
}

function applyLevels() {
  chips.forEach((b, i) => b.setAttribute("aria-pressed", active.has(LEVELS[i].id)));
  el.allLabel.textContent = active.size === LEVELS.length ? "回到 L1–L4" : "全部開啟";
  el.levels.classList.toggle("off", iceMode);
  el.ice.setAttribute("aria-pressed", iceMode);
  refill();
  if (!current || !pool().some(d => d.id === current.id)) draw();
  else render();
}

/* ---------- render ---------- */
function render() {
  el.back.disabled = history.length === 0;
  el.status.hidden = skipped.size === 0;
  if (skipped.size) el.statusText.textContent = `已隱藏 ${skipped.size} 題`;

  const p = pool();
  if (!current) {
    el.card.style.setProperty("--c", "var(--line-2)");
    el.badge.textContent = ""; el.tag.textContent = ""; el.note.textContent = "";
    el.follow.textContent = ""; el.count.textContent = "";
    el.skip.disabled = true; el.fav.disabled = true;
    el.q.innerHTML = `<span class="empty">${
      skipped.size && !p.length ? "這個範圍的題都被你隱藏了。" : "上面至少選一個層級。"
    }</span>`;
    return;
  }

  el.skip.disabled = false; el.fav.disabled = false;
  const L = LEVELS[current.lv - 1];
  const c = `var(--lv${current.lv})`;
  el.card.style.setProperty("--c", c);
  el.badge.style.setProperty("--c", c);
  el.badge.innerHTML = `L${L.id}<b>${L.name}</b>`;
  el.tag.textContent = current.tag;
  el.note.textContent = iceMode ? "破冰模式：面對面卡住時最好接的題。" : L.note;
  el.q.textContent = current.q;
  el.follow.innerHTML = `<span>接著問</span>${current.fu}`;
  el.fav.setAttribute("aria-pressed", favs.has(current.id));
  el.count.textContent = `剩 ${bag.length} / ${p.length} 題`;

  el.q.classList.remove("anim"); void el.q.offsetWidth; el.q.classList.add("anim");
}

/* ---------- controls ---------- */
el.ice.addEventListener("click", () => { iceMode = !iceMode; current = null; history = []; applyLevels(); });

el.all.addEventListener("click", () => {
  if (iceMode) { iceMode = false; }
  active = active.size === LEVELS.length ? new Set(DEFAULT_LEVELS) : new Set(LEVELS.map(L => L.id));
  store.set("levels", [...active]);
  applyLevels();
});

el.reset.addEventListener("click", () => { history = []; current = null; refill(); draw(); });

el.restore.addEventListener("click", (e) => {
  e.stopPropagation();
  skipped.clear(); store.set("skipped", []);
  refill(); render();
});

el.skip.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!current) return;
  skipped.add(current.id); favs.delete(current.id);
  store.set("skipped", [...skipped]); store.set("favs", [...favs]);
  bag = bag.filter(d => d.id !== current.id);
  history = history.filter(d => d.id !== current.id);
  current = null;
  draw();
});

el.fav.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!current) return;
  favs.has(current.id) ? favs.delete(current.id) : favs.add(current.id);
  store.set("favs", [...favs]);
  el.fav.setAttribute("aria-pressed", favs.has(current.id));
});

/* ---------- stats sheet ---------- */
function esc(s) {
  return String(s).replace(/[&<>]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
}

function qlist(ids) {
  if (!ids.length) return `<p class="none">還沒有標記。抽到順口的題就按卡片下面的「好用」。</p>`;
  return `<ul class="qlist">` + ids
    .map(id => DECK[id]).filter(Boolean)
    .sort((a, b) => a.lv - b.lv || a.id - b.id)
    .map(d => `<li><span class="l" style="--c:var(--lv${d.lv})">L${d.lv}</span><span>${esc(d.q)}</span></li>`)
    .join("") + `</ul>`;
}

function renderSheet() {
  const favIds = [...favs], skipIds = [...skipped];
  const dist = LEVELS
    .filter(L => stats.byLevel[L.id])
    .map(L => `<i style="--c:var(--lv${L.id})">L${L.id} ${stats.byLevel[L.id]}</i>`)
    .join("");

  el.now.textContent = `v${VERSION}　${new Date().toISOString().slice(0, 10)}`;
  el.sheetbody.innerHTML = `
    <div class="block">
      <div class="tiles">
        <div class="tile"><b>${stats.draws}</b><span>總抽題次數</span></div>
        <div class="tile"><b>${favIds.length}</b><span>標記好用</span></div>
        <div class="tile"><b>${skipIds.length}</b><span>已隱藏</span></div>
      </div>
      <div class="dist">
        ${dist || `<i style="--c:var(--line-2)">尚無紀錄</i>`}
        ${stats.ice ? `<i style="--c:var(--lv1)">破冰 ${stats.ice}</i>` : ""}
      </div>
      <p class="none" style="margin-top:9px">題庫 ${DECK.length} 題　·　資料起算 ${stats.since}　·　只存在這台裝置的瀏覽器</p>
    </div>

    <div class="block">
      <details open>
        <summary><h2 class="sh">標記好用 (${favIds.length})</h2></summary>
        ${qlist(favIds)}
      </details>
    </div>

    <div class="block">
      <details>
        <summary><h2 class="sh">已隱藏 (${skipIds.length})</h2></summary>
        ${skipIds.length ? qlist(skipIds) : `<p class="none">沒有隱藏任何題目。</p>`}
      </details>
    </div>

    <div class="block">
      <details>
        <summary><h2 class="sh">版本紀錄</h2></summary>
        <ul class="log">
          ${CHANGELOG.map(([v, d]) =>
            `<li><span class="v${v === VERSION ? " cur" : ""}">${v}</span><span class="d">${esc(d)}</span></li>`
          ).join("")}
        </ul>
        <button class="danger" id="wipe" type="button">清空所有統計與標記</button>
      </details>
    </div>
  `;

  document.getElementById("wipe").addEventListener("click", () => {
    const b = document.getElementById("wipe");
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "再按一次確認清空"; return; }
    favs.clear(); skipped.clear();
    stats = { draws: 0, byLevel: {}, ice: 0, since: new Date().toISOString().slice(0, 10) };
    store.set("favs", []); store.set("skipped", []); store.set("stats", stats);
    refill(); render(); renderSheet();
  });
}

function openSheet() { renderSheet(); el.sheetwrap.hidden = false; el.closeSheet.focus(); }
function closeSheet() { el.sheetwrap.hidden = true; el.ver.focus(); }

el.ver.addEventListener("click", openSheet);
el.closeSheet.addEventListener("click", closeSheet);
el.backdrop.addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !el.sheetwrap.hidden) closeSheet(); });

el.draw.addEventListener("click", draw);
el.card.addEventListener("click", draw);
el.back.addEventListener("click", (e) => {
  e.stopPropagation();
  const prev = history.pop();
  if (prev) { if (current) bag.push(current); current = prev; render(); }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === " " || e.key === "Enter") && el.sheetwrap.hidden && document.activeElement === document.body) {
    e.preventDefault(); draw();
  }
});

applyLevels();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
